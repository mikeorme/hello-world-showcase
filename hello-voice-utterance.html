<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, World — Spoken</title>
<meta name="description" content="Hello, World, spoken aloud, with real synchronized captions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#eef0fb; --bg:#0b0c16; --bg-2:#141628; --accent:#8f8bff; --line:rgba(255,255,255,0.12); }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 30%, #1c1e38, #0b0c16 75%);
    color:var(--ink); font-family:'Inter', sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
  }
  .stage{width:100%; max-width:560px; text-align:center;}

  .orb-wrap{position:relative; width:180px; height:180px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center;}
  .orb{
    width:96px; height:96px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #b7b3ff, var(--accent) 60%, #4d47b8 100%);
    box-shadow:0 0 60px rgba(143,139,255,0.5);
    transition:transform .3s ease;
  }
  .orb-wrap.speaking .orb{ animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }

  .bars{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:5px; pointer-events:none;}
  .bars span{
    width:4px; height:14px; border-radius:3px; background:rgba(143,139,255,0.55);
    transform-origin:center;
  }
  .orb-wrap.speaking .bars span{ animation:bar 0.8s ease-in-out infinite; }
  .bars span:nth-child(1){ animation-delay:0s; }
  .bars span:nth-child(2){ animation-delay:.1s; }
  .bars span:nth-child(3){ animation-delay:.2s; }
  .bars span:nth-child(4){ animation-delay:.3s; }
  .bars span:nth-child(5){ animation-delay:.15s; }
  @keyframes bar{ 0%,100%{transform:scaleY(0.5) translateY(0);} 50%{transform:scaleY(2.4);} }
  .bars span:nth-child(1),.bars span:nth-child(5){ transform-origin:center; margin:0 84px; }
  .bars span:nth-child(2),.bars span:nth-child(4){ margin:0 56px; }

  .caption{
    font-family:'Fraunces', serif; font-style:italic; font-weight:400;
    font-size:clamp(30px, 6vw, 48px); line-height:1.2;
  }
  .caption span{ opacity:0.35; transition:opacity .15s ease, color .15s ease; }
  .caption span.active{ opacity:1; color:#fff; }

  .fallback{font-size:14px; color:#a9a6c9; margin-top:8px; display:none;}

  .play-btn{
    margin-top:34px; display:inline-flex; align-items:center; gap:10px; padding:16px 30px; border-radius:100px;
    background:var(--accent); color:#0b0c16; border:none; font-weight:700; font-size:15px; cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .play-btn:hover{ transform:translateY(-2px); box-shadow:0 14px 30px rgba(143,139,255,0.35); }
  .play-btn:disabled{ opacity:0.5; cursor:default; transform:none; box-shadow:none; }

  .panel{
    margin-top:38px; text-align:left; background:var(--bg-2); border:1px solid var(--line); border-radius:16px; padding:22px 24px;
    display:flex; flex-direction:column; gap:16px;
  }
  .row{display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .row label{font-size:13px; color:#b8b5d6; font-weight:500;}
  select{
    background:#0f1122; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:inherit; font-size:13px; max-width:220px;
  }
  input[type=range]{ accent-color:var(--accent); width:150px; }
  .row .val{font-size:12px; color:#8b87ad; font-family:monospace; width:34px; text-align:right;}

  .hint{margin-top:20px; font-size:12.5px; color:#7d7aa0;}
</style>
</head>
<body>

<div class="stage">
  <div class="orb-wrap" id="orbWrap">
    <div class="orb"></div>
    <div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="caption" id="caption">
    <span data-i="0">Hello,</span> <span data-i="1">World.</span>
  </div>
  <div class="fallback" id="fallback">Speech synthesis isn't available in this browser — but you can still read it.</div>

  <button class="play-btn" id="playBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>
    Press to hear it
  </button>

  <div class="panel">
    <div class="row">
      <label for="voiceSelect">Voice</label>
      <select id="voiceSelect"></select>
    </div>
    <div class="row">
      <label for="rateRange">Rate</label>
      <input type="range" id="rateRange" min="0.5" max="1.8" step="0.1" value="0.9">
      <span class="val" id="rateVal">0.9</span>
    </div>
    <div class="row">
      <label for="pitchRange">Pitch</label>
      <input type="range" id="pitchRange" min="0" max="2" step="0.1" value="1">
      <span class="val" id="pitchVal">1.0</span>
    </div>
  </div>

  <p class="hint">Captions above highlight in sync with real word-boundary events from the speech engine — not a canned animation.</p>
</div>

<script>
  const text = 'Hello, World.';
  const words = [...text.matchAll(/\S+/g)].map(m => ({ start: m.index, end: m.index + m[0].length }));
  const spans = [...document.querySelectorAll('.caption span')];
  const orbWrap = document.getElementById('orbWrap');
  const playBtn = document.getElementById('playBtn');
  const voiceSelect = document.getElementById('voiceSelect');
  const rateRange = document.getElementById('rateRange');
  const pitchRange = document.getElementById('pitchRange');
  const rateVal = document.getElementById('rateVal');
  const pitchVal = document.getElementById('pitchVal');
  const fallback = document.getElementById('fallback');

  rateRange.addEventListener('input', () => rateVal.textContent = parseFloat(rateRange.value).toFixed(1));
  pitchRange.addEventListener('input', () => pitchVal.textContent = parseFloat(pitchRange.value).toFixed(1));

  if(!('speechSynthesis' in window)){
    fallback.style.display = 'block';
    playBtn.disabled = true;
  } else {
    let voices = [];
    function loadVoices(){
      voices = speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';
      const preferredIdx = voices.findIndex(v => v.lang && v.lang.startsWith('en') && v.default) >= 0
        ? voices.findIndex(v => v.lang && v.lang.startsWith('en') && v.default)
        : voices.findIndex(v => v.lang && v.lang.startsWith('en'));
      voices.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = v.name + (v.lang ? ' (' + v.lang + ')' : '');
        voiceSelect.appendChild(opt);
      });
      if(preferredIdx >= 0) voiceSelect.value = preferredIdx;
    }
    loadVoices();
    if(speechSynthesis.onvoiceschanged !== undefined){
      speechSynthesis.addEventListener('voiceschanged', loadVoices);
    }

    function clearHighlights(){
      spans.forEach(s => s.classList.remove('active'));
    }

    function speak(){
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const chosen = voices[parseInt(voiceSelect.value, 10)];
      if(chosen) utter.voice = chosen;
      utter.rate = parseFloat(rateRange.value);
      utter.pitch = parseFloat(pitchRange.value);

      utter.onstart = () => {
        orbWrap.classList.add('speaking');
        playBtn.disabled = true;
      };
      utter.onboundary = (e) => {
        if(e.name && e.name !== 'word') return;
        const idx = words.findIndex(w => e.charIndex >= w.start && e.charIndex < w.end);
        clearHighlights();
        if(idx >= 0 && spans[idx]) spans[idx].classList.add('active');
      };
      utter.onend = () => {
        orbWrap.classList.remove('speaking');
        clearHighlights();
        playBtn.disabled = false;
      };
      utter.onerror = () => {
        orbWrap.classList.remove('speaking');
        playBtn.disabled = false;
      };
      speechSynthesis.speak(utter);
    }

    playBtn.addEventListener('click', speak);
  }
</script>

</body>
</html>
